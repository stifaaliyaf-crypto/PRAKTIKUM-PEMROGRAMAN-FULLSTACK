<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Mahasiswa</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Kolom Kiri -->
        <div class="info-section">
            <h1 id="judul">Biodata Mahasiswa</h1>
            
            <!-- Kotak Pesan dipindah tepat di bawah judul -->
            <div id="kotakPesan" class="pesan-box">
                Status: Menunggu tombol diklik...
            </div>

            <p class="info-teks">Nama : Stifa Aliya Fauziyyah.</p>
            <p>Fakultas Sains dan Teknologi</p>
            <p>Program Studi Teknologi Informasi</p>
            
            <input type="text" name="inputNama" placeholder="Ketik nama baru di sini...">
        </div>

        <!-- Kolom Kanan: Tombol-tombol Aksi -->
        <div class="button-section">
            <button id="btnId">Ubah Warna (ID)</button>
            <button id="btnClass">Ubah Pesan (Class)</button>
            <button id="btnTag">Ubah Tag</button>
            <button id="btnName">Ubah Nilai Input</button>
            <button id="btnAll">Ubah Semua Sekaligus</button>
        </div>
    </div>
</body>
</html>
