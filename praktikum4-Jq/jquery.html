<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f8ff;
        }
        #kotak {
            width: 150px;
            height: 150px;
            background: #0099ff;
            margin: 20px auto;
            border-radius: 10px;
        }
        button {
            margin: 5px;
            padding: 8px 12px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>
    <h1 id="judul">Belajar jQuery</h1>
    <div id="kotak"></div>

    <button id="ubahWarna">Ubah Warna Kotak</button>
    <button id="sembunyikan">Sembunyikan</button>
    <button id="tampilkan">Tampilkan</button>
    <button id="animasi">Animasi</button>

</body>
</html>
