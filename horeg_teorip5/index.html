
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Kelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Pendaftaran Kelas</h2>
        <p>Silakan isi data diri untuk mendaftar kelas Pemrograman Web.</p>

        <form id="formDaftar" novalidate>

            <div class="form-group">
                <label>Nama</label>
                <input type="text" id="nama" placeholder="Masukkan nama">
                <small id="errorNama"></small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Masukkan email">
                <small id="errorEmail"></small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-box">
                    <input type="password" id="password" placeholder="Minimal 8 karakter">
                    <button type="button" id="togglePassword">Tampilkan</button>
                </div>
                <small id="errorPassword"></small>
            </div>

            <button type="submit" class="btn">Daftar</button>

            <p id="pesanSukses"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
